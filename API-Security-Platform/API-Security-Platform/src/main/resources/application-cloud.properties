# Cloud Database Configuration - TiDB

spring.datasource.url=jdbc:mysql://${TIDB_HOST}:${TIDB_PORT:4000}/api_security_platform?sslMode=VERIFY_IDENTITY
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Server
server.port=8080